name: Build LLVM wheels

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:
    inputs:
      llvm_ref:
        description: LLVM git ref (tag, branch, or SHA)
        required: true
        type: string

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read

  check:
    name: Check for existing wheels
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      matrix: ${{ steps.check.outputs.matrix }}
      platform_count: ${{ steps.check.outputs.platform_count }}
    steps:
      - uses: actions/checkout@v4

      # On workflow_dispatch, inputs.llvm_ref pins a single ref. On the
      # weekly schedule it's unset, so check_llvm.py auto-discovers main plus
      # the latest tag for each tracked release branch.
      - name: Resolve refs and check releases
        id: check
        env:
          HALIDE_LLVM_REF: ${{ inputs.llvm_ref }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check_llvm.py

  build:
    name: Build / ${{ matrix.ref }} / ${{ matrix.platform }}
    needs: [check, validate]
    if: needs.check.outputs.should_build == 'true'
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check.outputs.matrix) }}
    defaults:
      run:
        working-directory: packages/halide-llvm
    env:
      HALIDE_LLVM_REF: ${{ matrix.ref }}
      GITHUB_TOKEN: ${{ github.token }}
      CMAKE_GENERATOR: Ninja
      MACOSX_DEPLOYMENT_TARGET: "11"
    steps:
      - uses: actions/checkout@v4

      # Keep GCC 12 for manylinux builds: newer libstdc++ symbols are not
      # repaired by auditwheel and break consumers with older toolchains.
      - name: Set up GCC 12 and Python (manylinux)
        if: matrix.container
        run: |
          yum install -y gcc-toolset-12-gcc-c++
          echo "/opt/rh/gcc-toolset-12/root/usr/bin" >> "$GITHUB_PATH"
          echo "/opt/python/cp312-cp312/bin" >> "$GITHUB_PATH"

      - name: Set up Python
        if: ${{ !matrix.container && !matrix.docker_image }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # VS 2022 is intentionally pinned to match the toolset used by Halide.
      - name: Set up MSVC
        if: matrix.msvc_arch
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Build wheel
        if: ${{ !matrix.docker_image }}
        run: >
          pip wheel . -w dist/ -v
          --config-settings=cmake.define.CMAKE_TOOLCHAIN_FILE=toolchains/${{ matrix.toolchain }}

      - name: Retag wheel
        if: matrix.wheel_plat
        shell: bash
        run: |
          pip install wheel
          wheel tags --platform-tag ${{ matrix.wheel_plat }} --remove dist/*.whl

      # i686 and armv7l use Docker because the manylinux images cannot run
      # actions/checkout's Node runtime on those architectures.
      - name: Build wheel (docker)
        if: matrix.docker_image
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/project" \
            -w /project/packages/halide-llvm \
            -e HALIDE_LLVM_REF -e GITHUB_TOKEN \
            -e PIN_GCC12=${{ matrix.pin_gcc12 && 'true' || 'false' }} \
            ${{ matrix.docker_image }} bash -c '
              set -euo pipefail
              if [ "$PIN_GCC12" = true ]; then
                yum install -y gcc-toolset-12-gcc-c++
                export PATH="/opt/rh/gcc-toolset-12/root/usr/bin:$PATH"
              fi
              export PATH="/opt/python/cp312-cp312/bin:$PATH"
              pip wheel . -w dist/ -v --config-settings=cmake.define.CMAKE_TOOLCHAIN_FILE=toolchains/${{ matrix.toolchain }}
            '

      - name: Repair wheel (auditwheel)
        if: ${{ matrix.manylinux_plat && !matrix.docker_image }}
        run: |
          pip install auditwheel
          auditwheel repair --plat ${{ matrix.manylinux_plat }} -w dist/ dist/*.whl
          rm -f dist/*-linux_*.whl

      - name: Repair wheel (auditwheel/docker)
        if: ${{ matrix.manylinux_plat && matrix.docker_image }}
        run: |
          docker run --rm -v "${{ github.workspace }}:/project" \
            -w /project/packages/halide-llvm ${{ matrix.docker_image }} bash -c '
              set -euo pipefail
              export PATH="/opt/python/cp312-cp312/bin:$PATH"
              pip install auditwheel
              auditwheel repair --plat ${{ matrix.manylinux_plat }} -w dist/ dist/*.whl
              rm -f dist/*-linux_*.whl
            '

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.ref }}-${{ matrix.platform }}
          path: packages/halide-llvm/dist/*.whl

  publish:
    name: Publish LLVM release
    needs: [check, build]
    # Run even if some ref/platform legs failed, so refs that fully succeeded
    # still get published; publish_releases.py withholds any ref that's
    # missing platforms rather than publishing a partial release, so a
    # persistent single-platform failure doesn't get masked from retry.
    if: ${{ !cancelled() && needs.build.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          DIST_DIR: dist
          GH_TOKEN: ${{ github.token }}
          EXPECTED_PLATFORM_COUNT: ${{ needs.check.outputs.platform_count }}
        run: python3 scripts/publish_releases.py

  rebuild-index:
    needs: publish
    uses: ./.github/workflows/rebuild-index.yml
    permissions:
      contents: read
      pages: write
      id-token: write
